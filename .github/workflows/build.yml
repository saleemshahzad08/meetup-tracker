name: Build APK

on:
  push:
  workflow_dispatch:
    # Lets you click a "Run workflow" button on GitHub's website to
    # trigger a build manually, without needing to push new code.

jobs:
  build-android:
    name: Build Android APK
    # Pinned to a specific Ubuntu version (rather than "latest") so this
    # doesn't unexpectedly break again if GitHub changes their default.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake python3-pip python3-venv

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --user --upgrade Cython==0.29.36 virtualenv
          pip3 install --user --upgrade buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      # Fix for the repeated "HTTP Error 502: Bad Gateway" failure.
      #
      # Our previous attempt pointed Buildozer at a pre-installed NDK via
      # an environment variable, but Buildozer kept trying to download
      # its own copy anyway - meaning it doesn't reliably honor that
      # variable. This time we skip relying on Buildozer noticing an env
      # var at all: we download the NDK ourselves (with our own retries,
      # so a single transient 502 doesn't kill the whole job) and place
      # it in the EXACT folder Buildozer already checks before it tries
      # to download anything - so it just finds it sitting there and
      # never attempts the download in the first place.
      # (This step runs after the cache-restore step above, so once a
      # build has succeeded once, later runs find the NDK already
      # sitting in the restored cache and skip the download too.)
      - name: Pre-install Android NDK (avoids Buildozer's own download step)
        run: |
          set -e
          PLATFORM_DIR="$HOME/.buildozer/android/platform"
          NDK_DIR="$PLATFORM_DIR/android-ndk-r28c"
          mkdir -p "$PLATFORM_DIR"

          if [ -d "$NDK_DIR" ]; then
            echo "NDK already present at $NDK_DIR (from cache) - skipping download"
          else
            cd /tmp
            NDK_URL="https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
            for i in 1 2 3 4 5; do
              echo "Download attempt $i..."
              if curl -fSL --retry 5 --retry-delay 10 "$NDK_URL" -o ndk.zip; then
                echo "Download succeeded"
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "All download attempts failed"
                exit 1
              fi
              sleep $((i * 15))
            done
            unzip -q ndk.zip -d "$PLATFORM_DIR"
            rm -f ndk.zip
          fi

          # Belt-and-braces: also export it as an env var, in case any
          # part of the toolchain does check for it.
          echo "ANDROIDNDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if yes | buildozer -v android debug; then
              echo "Build succeeded"
              exit 0
            else
              BUILD_EXIT_CODE=$?
              if [ $attempt -lt 3 ]; then
                WAIT_TIME=$((30 * attempt + RANDOM % 30))
                echo "Build failed with exit code $BUILD_EXIT_CODE, waiting ${WAIT_TIME}s before retry..."
                sleep $WAIT_TIME
              else
                echo "Build failed after 3 attempts"
                exit $BUILD_EXIT_CODE
              fi
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meetup-tracker-apk
          path: bin/*.apk
